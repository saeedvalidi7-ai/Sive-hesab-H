<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f32"><title>سیوا حساب</title>
<style>
@font-face{font-family:BNazanin;src:local("B Nazanin"),local("B Nazanin Bold")}*{box-sizing:border-box}
:root{--cream:#f5efdf;--paper:#fffaf0;--green:#173f32;--green2:#245744;--gold:#c7a451;--ink:#23362e;--muted:#77847a;--line:#e5dcc7;--red:#b94a48}
body{margin:0;background:linear-gradient(135deg,#f5efdf,#eee4ce);color:var(--ink);font-family:BNazanin,"Vazirmatn","Tahoma",sans-serif;font-size:16px}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 15px;background:var(--green);color:#fff}button:hover{filter:brightness(1.1);transform:translateY(-1px)}.secondary{background:#e9dfc8;color:var(--green)}.gold{background:var(--gold);color:#172e25}.danger{background:#a8403c}.muted{color:var(--muted)}.hidden{display:none!important}
#splash{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top,#fff9e9,#e8ddc3)}.splash-card{width:min(520px,100%);text-align:center;padding:25px 25px 35px;border:1px solid #fff;border-radius:30px;background:#fff9edcc;box-shadow:0 25px 80px #173f3220;animation:rise .9s ease both}.splash-logo{width:min(330px,82%);border-radius:20px;mix-blend-mode:multiply;animation:float 4s ease-in-out infinite}.splash-card h1{font-size:2.2rem;color:var(--green);margin:8px 0}.splash-card p{color:#92732f;margin:0 0 24px}@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#app{min-height:100vh}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 22px;background:#173f32;color:#fff;box-shadow:0 5px 22px #173f3220;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-size:1.3rem;font-weight:bold}.brand img{width:43px;height:43px;object-fit:cover;border-radius:50%;background:var(--cream)}.topbar small{color:#e7d59d;display:block;font-size:.75rem}.layout{display:grid;grid-template-columns:230px 1fr;max-width:1500px;margin:auto;gap:18px;padding:18px}.sidebar,.panel,.stat{background:#fffaf0d9;border:1px solid #ffffffd9;border-radius:20px;box-shadow:0 10px 35px #173f320a;backdrop-filter:blur(12px)}.sidebar{padding:13px;height:max-content;position:sticky;top:85px}.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:right;margin:4px 0;background:transparent;color:var(--green);border:1px solid transparent}.navbtn.active,.navbtn:hover{background:#e8efdf;border-color:#d9e1d2;transform:none}.content{min-width:0;animation:page .35s ease}@keyframes page{from{opacity:.4;transform:rotateY(-3deg) translateX(8px)}to{opacity:1;transform:none}}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:3px 0 17px}.pagehead h2{margin:0;color:var(--green)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{padding:17px}.stat .label{color:var(--muted);font-size:.9rem}.stat strong{display:block;font-size:1.35rem;color:var(--green);margin-top:7px}.panel{padding:18px;margin-bottom:16px}.panel h3{margin:0 0 14px;color:var(--green)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:.9rem;color:#52645a}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fffdf8;border-radius:10px;padding:10px;color:var(--ink);min-width:0}.field textarea{min-height:70px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:right;padding:11px;border-bottom:1px solid var(--line)}th{background:#edf0e5;color:var(--green);font-weight:bold}tr:last-child td{border-bottom:0}.empty{text-align:center;padding:25px;color:var(--muted)}.badge{border-radius:99px;padding:4px 9px;background:#e7efdf;color:var(--green);font-size:.82rem}.badge.low{background:#f8e5d7;color:#9c4d25}.barrow{display:grid;grid-template-columns:90px 1fr 75px;gap:10px;align-items:center;margin:12px 0}.bar{height:10px;background:#e9e1d0;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--gold));border-radius:20px}.small{font-size:.85rem}.footer{text-align:center;color:var(--muted);padding:18px}.overlay{position:fixed;inset:0;background:#14251f88;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{background:var(--paper);padding:22px;border-radius:20px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px #0003}.modal h3{margin-top:0;color:var(--green)}.toast{position:fixed;bottom:20px;left:20px;background:var(--green);color:white;padding:12px 18px;border-radius:12px;z-index:30;box-shadow:0 8px 24px #0002}.invoice-preview{background:#fffdf7;border:1px dashed var(--gold);padding:16px;border-radius:14px}.invoice-head{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:12px}.logo-small{width:72px;height:72px;object-fit:cover;border-radius:10px}.settings-logo{max-width:150px;max-height:130px;object-fit:contain}.filelabel{display:inline-block;background:#e9dfc8;color:var(--green);padding:8px 12px;border-radius:10px;cursor:pointer}.filelabel input{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:10px}.sidebar{position:static;display:flex;overflow:auto;gap:4px;padding:7px}.navbtn{width:auto;min-width:max-content;margin:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.topbar{padding:10px 13px}}@media(max-width:500px){.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:1.1rem}.formgrid{grid-template-columns:1fr}.pagehead{align-items:flex-start;flex-direction:column}.panel{padding:13px}}
@media print{body{background:white}.topbar,.sidebar,.pagehead,.no-print,.footer{display:none!important}.layout{display:block;padding:0}.panel{box-shadow:none;border:0}.invoice-preview{border:0}}
</style></head>
<body>
<section id="splash"><div class="splash-card">
<img class="splash-logo" id="splashLogo" src="assets/siva-hesab-logo.png" alt="لوگوی سیوا حساب">
<h1>سیوا حساب</h1><p>حسابداری هوشمند، فروش و مدیریت انبار</p>
<button onclick="enterApp()" style="min-width:190px;padding:13px 24px;font-size:1.08rem">ورود به برنامه ←</button>
<div class="muted small" style="margin-top:18px">نسخه آغازین · اطلاعات روی همین دستگاه ذخیره می‌شود</div>
</div></section>
<div id="app" class="hidden">
<header class="topbar"><div class="brand"><img id="topLogo" src="assets/siva-hesab-logo.png" alt=""><div>سیوا حساب<small>سامانه مدیریت فروش و انبار</small></div></div><div><span id="today"></span><button class="secondary" onclick="exitApp()" style="margin-right:8px">خروج</button></div></header>
<div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="content" id="content"></main></div>
<div class="footer">سیوا حساب · نسخه آغازین آفلاین</div></div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);
const fa=n=>Number(n||0).toLocaleString('fa-IR',{maximumFractionDigits:2});
const toman=n=>fa(n)+' تومان';
const nowDate=()=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return new Date().toLocaleDateString('fa-IR')}};
const defaultData={products:[],customers:[],invoices:[],movements:[],settings:{businessName:'سیوا حساب',phone:'',address:'',tax:0,logo:'assets/siva-hesab-logo.png',stamp:'',signature:''},receipts:[]};
let db=loadDB(),page='dashboard',dirty=false,invoiceDraft=[];
function loadDB(){try{return {...structuredClone(defaultData),...JSON.parse(localStorage.getItem('sivaHesabDB')||'{}')}}catch(e){return structuredClone(defaultData)}}
function saveDB(){localStorage.setItem('sivaHesabDB',JSON.stringify(db));dirty=false;toast('اطلاعات با موفقیت ذخیره شد')}
function markDirty(){dirty=true}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2500)}
function enterApp(){ $('#splash').classList.add('hidden');$('#app').classList.remove('hidden');$('#today').textContent=nowDate();render()}
function exitApp(){if(dirty){showModal('ذخیره تغییرات؟','تغییرات ذخیره‌نشده دارید. چه کاری انجام شود؟',`<div class="actions"><button onclick="saveDB();closeModal();leaveApp()">ذخیره و خروج</button><button class="danger" onclick="dirty=false;closeModal();leaveApp()">خروج بدون ذخیره</button><button class="secondary" onclick="closeModal()">انصراف</button></div>`)}else leaveApp()}
function leaveApp(){$('#app').classList.add('hidden');$('#splash').classList.remove('hidden')}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}})
const nav=[['dashboard','▦','داشبورد'],['products','▤','انبار کالا'],['customers','♙','مشتریان'],['invoices','▧','فاکتور فروش'],['purchases','⇩','ثبت خرید'],['reports','▥','گزارش‌ها'],['settings','⚙','تنظیمات']];
function render(){ $('#sidebar').innerHTML=nav.map(n=>`<button class="navbtn ${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');const fn={dashboard:dashboardPage,products:productsPage,customers:customersPage,invoices:invoicesPage,purchases:purchasesPage,reports:reportsPage,settings:settingsPage};$('#content').innerHTML=fn[page]();$('#today').textContent=nowDate()}
function go(p){page=p;render()}
function pageHead(title,sub,button=''){return `<div class="pagehead"><div><h2>${title}</h2><div class="muted small">${sub||''}</div></div>${button}</div>`}
function dashboardPage(){const sales=db.invoices.filter(i=>i.type==='فروش');const total=sales.reduce((s,i)=>s+i.total,0);const paid=sales.reduce((s,i)=>s+i.paid,0);const low=db.products.filter(p=>Number(p.qty)<=Number(p.reorder||0));const bars=Array.from({length:6},(_,k)=>{const d=new Date();d.setMonth(d.getMonth()-5+k);const key=d.getMonth();const sum=sales.filter(i=>new Date(i.iso||i.created).getMonth()===key).reduce((s,i)=>s+i.total,0);return {m:new Intl.DateTimeFormat('fa-IR',{month:'short'}).format(d),sum}});const max=Math.max(1,...bars.map(b=>b.sum));return `${pageHead('داشبورد مدیریت','نمای کلی عملکرد کسب‌وکار',`<button onclick="go('invoices')">＋ فاکتور جدید</button>`)}<div class="stats"><div class="stat"><span class="label">فروش ثبت‌شده</span><strong>${toman(total)}</strong></div><div class="stat"><span class="label">دریافتی از فروش</span><strong>${toman(paid)}</strong></div><div class="stat"><span class="label">تعداد کالاها</span><strong>${fa(db.products.length)} قلم</strong></div><div class="stat"><span class="label">هشدار موجودی</span><strong>${fa(low.length)} کالا</strong></div></div><div class="grid2"><section class="panel"><h3>روند فروش شش ماه اخیر</h3>${bars.map(b=>`<div class="barrow"><span>${b.m}</span><div class="bar"><i style="width:${Math.round(b.sum/max*100)}%"></i></div><span class="small">${fa(b.sum)}</span></div>`).join('')}<div class="muted small">نمودار بر اساس فاکتورهای ثبت‌شده در این دستگاه است.</div></section><section class="panel"><h3>هشدارهای انبار</h3>${low.length?low.slice(0,6).map(p=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0"><span>${esc(p.name)}</span><span class="badge low">${fa(p.qty)} ${esc(p.unit||'عدد')}</span></div>`).join(''):'<div class="empty">در حال حاضر کالایی زیر نقطه سفارش نیست.</div>'}<button class="secondary" onclick="go('products')" style="margin-top:12px">مدیریت انبار</button></section></div><section class="panel"><h3>آخرین فاکتورها</h3>${invoiceTable(db.invoices.slice(-5).reverse())}</section>`}
function productsPage(){return `${pageHead('مدیریت انبار','تعریف کالا، موجودی و نقطه سفارش',`<button onclick="productForm()">＋ افزودن کالا</button>`)}<section class="panel"><div class="tablewrap">${db.products.length?`<table><thead><tr><th>کالا</th><th>کد</th><th>واحد</th><th>موجودی</th><th>قیمت خرید</th><th>قیمت فروش</th><th>نقطه سفارش</th><th>عملیات</th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${p.image?`<img src="${p.image}" style="width:35px;height:35px;object-fit:cover;vertical-align:middle;border-radius:8px"> `:''}${esc(p.name)}</td><td>${esc(p.sku||'—')}</td><td>${esc(p.unit||'عدد')}</td><td><span class="badge ${+p.qty<=+p.reorder?'low':''}">${fa(p.qty)}</span></td><td>${fa(p.buy)}</td><td>${fa(p.sell)}</td><td>${fa(p.reorder)}</td><td><button class="secondary" onclick="productForm('${p.id}')">ویرایش</button> <button class="danger" onclick="delProduct('${p.id}')">حذف</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">هنوز کالایی ثبت نشده است. از «افزودن کالا» شروع کنید.</div>'}</div></section>`}
function productForm(id=''){const p=db.products.find(x=>x.id===id)||{name:'',sku:'',unit:'عدد',qty:0,buy:0,sell:0,reorder:0,image:''};showModal(id?'ویرایش کالا':'افزودن کالا', '',`<form onsubmit="saveProduct(event,'${id}')"><div class="formgrid">${field('نام کالا','name',p.name,true)}${field('کد کالا / SKU','sku',p.sku)}${field('واحد اندازه‌گیری','unit',p.unit)}${field('موجودی فعلی','qty',p.qty,false,'number')}${field('قیمت خرید (تومان)','buy',p.buy,false,'number')}${field('قیمت فروش (تومان)','sell',p.sell,false,'number')}${field('نقطه سفارش','reorder',p.reorder,false,'number')}<div class="field"><label>عکس محصول</label><input type="file" accept="image/*" id="productImage"></div></div><div class="actions"><button>ذخیره کالا</button><button type="button" class="secondary" onclick="closeModal()">انصراف</button></div></form>`)}
function saveProduct(e,id){e.preventDefault();const f=e.target;const old=db.products.find(p=>p.id===id);const p={id:id||uid(),name:f.name.value.trim(),sku:f.sku.value.trim(),unit:f.unit.value.trim()||'عدد',qty:+f.qty.value,buy:+f.buy.value,sell:+f.sell.value,reorder:+f.reorder.value,image:old?.image||''};const file=$('#productImage').files[0];const commit=()=>{if(old)Object.assign(old,p);else db.products.push(p);markDirty();closeModal();render();toast('کالا ثبت شد')};if(file){if(file.size>900000){toast('حجم عکس بهتر است کمتر از ۹۰۰ کیلوبایت باشد');return}const r=new FileReader();r.onload=()=>{p.image=r.result;commit()};r.readAsDataURL(file)}else commit()}
function delProduct(id){confirmAction('حذف کالا','این کالا حذف شود؟',()=>{db.products=db.products.filter(p=>p.id!==id);markDirty();render()})}
function customersPage(){return `${pageHead('مشتریان و طرف‌حساب‌ها','اطلاعات تماس و مانده حساب',`<button onclick="customerForm()">＋ مشتری جدید</button>`)}<section class="panel"><div class="tablewrap">${db.customers.length?`<table><thead><tr><th>نام</th><th>تلفن</th><th>نوع</th><th>نشانی</th><th>عملیات</th></tr></thead><tbody>${db.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone||'—')}</td><td>${esc(c.kind||'مشتری')}</td><td>${esc(c.address||'—')}</td><td><button class="secondary" onclick="customerForm('${c.id}')">ویرایش</button> <button class="danger" onclick="delCustomer('${c.id}')">حذف</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">فهرست مشتریان خالی است.</div>'}</div></section>`}
function customerForm(id=''){const c=db.customers.find(x=>x.id===id)||{name:'',phone:'',kind:'مشتری',address:'',code:''};showModal(id?'ویرایش طرف‌حساب':'طرف‌حساب جدید','',`<form onsubmit="saveCustomer(event,'${id}')"><div class="formgrid">${field('نام کامل / شرکت','name',c.name,true)}${field('شماره تماس','phone',c.phone)}<div class="field"><label>نوع طرف‌حساب</label><select name="kind"><option ${c.kind==='مشتری'?'selected':''}>مشتری</option><option ${c.kind==='تأمین‌کننده'?'selected':''}>تأمین‌کننده</option><option ${c.kind==='هر دو'?'selected':''}>هر دو</option></select></div>${field('کد اقتصادی / شناسه (اختیاری)','code',c.code)}<div class="field" style="grid-column:1/-1"><label>نشانی</label><textarea name="address">${esc(c.address)}</textarea></div></div><div class="actions"><button>ذخیره</button><button type="button" class="secondary" onclick="closeModal()">انصراف</button></div></form>`)}
function saveCustomer(e,id){e.preventDefault();const f=e.target,c={id:id||uid(),name:f.name.value.trim(),phone:f.phone.value.trim(),kind:f.kind.value,address:f.address.value.trim(),code:f.code.value.trim()};if(!c.name)return;const old=db.customers.find(x=>x.id===id);if(old)Object.assign(old,c);else db.customers.push(c);markDirty();closeModal();render();toast('طرف‌حساب ذخیره شد')}
function delCustomer(id){confirmAction('حذف طرف‌حساب','این طرف‌حساب حذف شود؟',()=>{db.customers=db.customers.filter(c=>c.id!==id);markDirty();render()})}
function invoicesPage(){return `${pageHead('فاکتور فروش','ایجاد فاکتور دیجیتال با چاپ و ذخیره',`<button onclick="newInvoice('فروش')">＋ فاکتور فروش جدید</button>`)}<section class="panel"><div class="tablewrap">${invoiceTable(db.invoices.filter(i=>i.type==='فروش').slice().reverse())}</div></section>`}
function purchasesPage(){return `${pageHead('ثبت خرید','ثبت خرید کالا و افزایش موجودی',`<button onclick="newInvoice('خرید')">＋ فاکتور خرید جدید</button>`)}<section class="panel"><div class="tablewrap">${invoiceTable(db.invoices.filter(i=>i.type==='خرید').slice().reverse())}</div></section>`}
function invoiceTable(list){if(!list.length)return '<div class="empty">هنوز فاکتوری ثبت نشده است.</div>';return `<table><thead><tr><th>شماره</th><th>نوع</th><th>تاریخ</th><th>طرف حساب</th><th>مبلغ کل</th><th>پرداخت‌شده</th><th>مانده</th><th>عملیات</th></tr></thead><tbody>${list.map(i=>`<tr><td>${esc(i.number)}</td><td>${esc(i.type)}</td><td>${esc(i.date)}</td><td>${esc(i.party)}</td><td>${fa(i.total)}</td><td>${fa(i.paid)}</td><td>${fa(i.total-i.paid)}</td><td><button class="secondary" onclick="viewInvoice('${i.id}')">نمایش / چاپ</button></td></tr>`).join('')}</tbody></table>`}
function newInvoice(type){invoiceDraft=[];showModal('ایجاد فاکتور '+type,'',invoiceFormHTML(type));refreshInvoiceForm(type)}
function invoiceFormHTML(type){return `<form id="invoiceForm" onsubmit="saveInvoice(event,'${type}')"><div class="formgrid"><div class="field"><label>طرف حساب</label><select name="party" required><option value="">انتخاب کنید</option>${db.customers.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div>${field('تاریخ شمسی','date',nowDate(),true)}${field('تخفیف (تومان)','discount',0,false,'number')}${field('مالیات (%)','tax',db.settings.tax||0,false,'number')}${field('مبلغ پرداختی (تومان)','paid',0,false,'number')}</div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h3>اقلام فاکتور</h3><div class="formgrid"><div class="field"><label>کالا</label><select id="lineProduct"><option value="">انتخاب کالا</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — موجودی ${fa(p.qty)}</option>`).join('')}</select></div>${field('تعداد','lineQty',1,false,'number')}</div><div class="actions"><button type="button" class="secondary" onclick="addInvoiceLine('${type}')">افزودن قلم</button></div><div id="invoiceLines" class="tablewrap" style="margin-top:12px"></div><div id="invoiceTotal" style="text-align:left;font-weight:bold;margin-top:12px"></div><div class="actions"><button type="submit">ثبت فاکتور</button><button type="button" class="secondary" onclick="closeModal()">انصراف</button></div></form>`}
function refreshInvoiceForm(type){renderInvoiceLines(type)}
function addInvoiceLine(type){const pid=$('#lineProduct').value,p=db.products.find(x=>x.id===pid),qty=+$('#lineQty').value;if(!p||qty<=0){toast('کالا و تعداد معتبر را انتخاب کنید');return}if(type==='فروش'&&qty>p.qty){toast('موجودی کالا کافی نیست');return}const existing=invoiceDraft.find(x=>x.productId===pid);if(existing)existing.qty+=qty;else invoiceDraft.push({productId:pid,name:p.name,qty,price:type==='فروش'?+p.sell:+p.buy,unit:p.unit});renderInvoiceLines(type)}
function renderInvoiceLines(type){const el=$('#invoiceLines');if(!el)return;el.innerHTML=invoiceDraft.length?`<table><thead><tr><th>کالا</th><th>تعداد</th><th>قیمت واحد</th><th>جمع</th><th></th></tr></thead><tbody>${invoiceDraft.map((l,n)=>`<tr><td>${esc(l.name)}</td><td>${fa(l.qty)} ${esc(l.unit)}</td><td>${fa(l.price)}</td><td>${fa(l.qty*l.price)}</td><td><button type="button" class="danger" onclick="invoiceDraft.splice(${n},1);renderInvoiceLines('${type}')">×</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">هنوز قلمی اضافه نشده است.</div>';const subtotal=invoiceDraft.reduce((s,l)=>s+l.qty*l.price,0);const f=$('#invoiceForm');if(f){const discount=+f.discount.value||0,tax=+f.tax.value||0;$('#invoiceTotal').textContent='جمع قابل پرداخت: '+fa(Math.max(0,subtotal-discount)*(1+tax/100))+' تومان'}}
function saveInvoice(e,type){e.preventDefault();if(!invoiceDraft.length){toast('حداقل یک قلم به فاکتور اضافه کنید');return}const f=e.target,subtotal=invoiceDraft.reduce((s,l)=>s+l.qty*l.price,0),discount=Math.max(0,+f.discount.value||0),tax=Math.max(0,+f.tax.value||0),total=Math.round(Math.max(0,subtotal-discount)*(1+tax/100)),paid=Math.max(0,Math.min(total,+f.paid.value||0));if(type==='فروش'){for(const l of invoiceDraft){const p=db.products.find(p=>p.id===l.productId);if(!p||p.qty<l.qty){toast('موجودی برای '+l.name+' کافی نیست');return}}}for(const l of invoiceDraft){const p=db.products.find(p=>p.id===l.productId);if(p){p.qty+=type==='فروش'?-l.qty:l.qty;db.movements.push({id:uid(),date:f.date.value,productId:p.id,qty:(type==='فروش'?-1:1)*l.qty,reason:'فاکتور '+type})}}const i={id:uid(),number:(type==='فروش'?'ف-':'خ-')+(db.invoices.length+1).toString().padStart(5,'0'),type,date:f.date.value,iso:new Date().toISOString(),party:f.party.value,lines:invoiceDraft.map(x=>({...x})),subtotal,discount,tax,total,paid,created:new Date().toISOString()};db.invoices.push(i);markDirty();invoiceDraft=[];closeModal();render();toast('فاکتور ثبت شد؛ برای ماندگاری ذخیره را بزنید')}
function viewInvoice(id){const i=db.invoices.find(x=>x.id===id);if(!i)return;const s=db.settings;showModal('پیش‌نمایش فاکتور', '',`<div class="invoice-preview" id="printArea"><div class="invoice-head"><div><h2 style="color:var(--green);margin:0">${esc(s.businessName||'سیوا حساب')}</h2><div>${esc(s.address||'')}</div><div>تلفن: ${esc(s.phone||'—')}</div></div>${s.logo?`<img class="logo-small" src="${s.logo}">`:''}</div><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><strong>فاکتور ${esc(i.type)} شماره ${esc(i.number)}</strong><span>تاریخ: ${esc(i.date)}</span></div><p>طرف حساب: <b>${esc(i.party)}</b></p><table><thead><tr><th>شرح کالا</th><th>تعداد</th><th>واحد</th><th>قیمت واحد</th><th>مبلغ</th></tr></thead><tbody>${i.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${fa(l.qty)}</td><td>${esc(l.unit)}</td><td>${fa(l.price)}</td><td>${fa(l.qty*l.price)}</td></tr>`).join('')}</tbody></table><div style="text-align:left;line-height:2;margin-top:12px">جمع: ${fa(i.subtotal)} تومان<br>تخفیف: ${fa(i.discount)} تومان<br>مالیات: ${fa(i.tax)}٪<br><b>مبلغ نهایی: ${fa(i.total)} تومان</b><br>پرداخت‌شده: ${fa(i.paid)} تومان<br>مانده: ${fa(i.total-i.paid)} تومان</div><div style="display:flex;justify-content:space-between;margin-top:25px"><div>مهر: ${s.stamp?`<img style="max-width:90px;max-height:65px" src="${s.stamp}">`:'................'}</div><div>امضا: ${s.signature?`<img style="max-width:90px;max-height:65px" src="${s.signature}">`:'................'}</div></div></div><div class="actions no-print"><button onclick="window.print()">چاپ / ذخیره PDF</button><button class="secondary" onclick="closeModal()">بستن</button></div>`)}
function reportsPage(){const sales=db.invoices.filter(i=>i.type==='فروش'),buy=db.invoices.filter(i=>i.type==='خرید'),sum=a=>a.reduce((s,x)=>s+x.total,0),top={};sales.forEach(i=>i.lines.forEach(l=>top[l.name]=(top[l.name]||0)+l.qty));const ranked=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,8);return `${pageHead('گزارش‌ها','خلاصه عملکرد بر اساس داده‌های ثبت‌شده')}<div class="stats"><div class="stat"><span class="label">مجموع فروش</span><strong>${toman(sum(sales))}</strong></div><div class="stat"><span class="label">مجموع خرید</span><strong>${toman(sum(buy))}</strong></div><div class="stat"><span class="label">مانده دریافتنی فروش</span><strong>${toman(sales.reduce((s,i)=>s+i.total-i.paid,0))}</strong></div><div class="stat"><span class="label">ارزش تقریبی موجودی به قیمت خرید</span><strong>${toman(db.products.reduce((s,p)=>s+p.qty*p.buy,0))}</strong></div></div><section class="panel"><h3>کالاهای پرفروش بر اساس تعداد</h3>${ranked.length?ranked.map(([n,q])=>`<div class="barrow"><span>${esc(n)}</span><div class="bar"><i style="width:${Math.max(5,q/Math.max(...ranked.map(x=>x[1]))*100)}%"></i></div><span>${fa(q)} عدد</span></div>`).join(''):'<div class="empty">پس از ثبت فاکتور فروش، این گزارش تکمیل می‌شود.</div>'}<p class="muted small">سود خالص و مالیات قطعی نیازمند ثبت هزینه‌ها و تنظیمات مالیاتی دقیق‌تر است؛ این نسخه آن‌ها را به‌عنوان اطلاعات رسمی مالیاتی تأیید نمی‌کند.</p></section>`}
function settingsPage(){const s=db.settings;return `${pageHead('تنظیمات','مشخصات کسب‌وکار، پشتیبان‌گیری و ظاهر')}<section class="panel"><h3>مشخصات کسب‌وکار</h3><form onsubmit="saveSettings(event)"><div class="formgrid">${field('نام کسب‌وکار','businessName',s.businessName,true)}${field('تلفن','phone',s.phone)}${field('مالیات پیش‌فرض (%)','tax',s.tax,false,'number')}<div class="field"><label>لوگوی کسب‌وکار</label><input type="file" id="logoFile" accept="image/*">${s.logo?`<img class="settings-logo" src="${s.logo}">`:''}</div><div class="field"><label>تصویر مهر (اختیاری)</label><input type="file" id="stampFile" accept="image/*">${s.stamp?`<img class="settings-logo" src="${s.stamp}">`:''}</div><div class="field"><label>تصویر امضا (اختیاری)</label><input type="file" id="signatureFile" accept="image/*">${s.signature?`<img class="settings-logo" src="${s.signature}">`:''}</div><div class="field" style="grid-column:1/-1"><label>نشانی</label><textarea name="address">${esc(s.address||'')}</textarea></div></div><div class="actions"><button>ذخیره تنظیمات</button></div></form></section><section class="panel"><h3>ذخیره و بازیابی اطلاعات</h3><p class="muted">اطلاعات این نسخه روی همین مرورگر ذخیره می‌شود. برای جلوگیری از ازدست‌رفتن اطلاعات، مرتب نسخه پشتیبان بگیرید.</p><div class="actions"><button onclick="saveDB()">ذخیره همه اطلاعات</button><button class="secondary" onclick="backup()">دریافت نسخه پشتیبان</button><label class="filelabel">بازیابی نسخه پشتیبان<input type="file" accept=".json,application/json" onchange="restoreBackup(event)"></label><button class="danger" onclick="resetData()">پاک‌کردن همه اطلاعات</button></div></section><section class="panel"><h3>پشتیبانی</h3><p>سیوا حساب · نسخه آغازین آفلاین</p><p class="muted small">این نسخه نمونه اولیه است؛ پیش از استفاده تجاری، از پشتیبان‌گیری، امنیت، چاپ و محاسبات روی دستگاه واقعی اطمینان حاصل کنید.</p></section>`}
function saveSettings(e){e.preventDefault();const f=e.target;db.settings.businessName=f.businessName.value.trim()||'سیوا حساب';db.settings.phone=f.phone.value.trim();db.settings.address=f.address.value.trim();db.settings.tax=Math.max(0,+f.tax.value||0);const files=[['logoFile','logo'],['stampFile','stamp'],['signatureFile','signature']].filter(([id])=>$('#'+id).files[0]);const read=(idx)=>{if(idx>=files.length){markDirty();render();toast('تنظیمات ثبت شد');return}const [id,key]=files[idx],file=$('#'+id).files[0];if(file.size>900000){toast('تصویر حجیم است؛ حداکثر حدود ۹۰۰ کیلوبایت');read(idx+1);return}const r=new FileReader();r.onload=()=>{db.settings[key]=r.result;read(idx+1)};r.readAsDataURL(file)};read(0)}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='siva-hesab-backup-'+Date.now()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.products)||!Array.isArray(x.invoices)||!x.settings)throw Error();showModal('تأیید بازیابی','اطلاعات فعلی با نسخه پشتیبان جایگزین می‌شود.',`<div class="actions"><button class="danger" onclick="db=${JSON.stringify(x).replace(/</g,'\\u003c')};markDirty();closeModal();render();toast('بازیابی انجام شد')">تأیید و بازیابی</button><button class="secondary" onclick="closeModal()">انصراف</button></div>`)}catch(err){toast('فایل پشتیبان معتبر نیست')}};r.readAsText(file);e.target.value=''}
function resetData(){confirmAction('پاک‌کردن اطلاعات','تمام کالاها، مشتریان و فاکتورها پاک شوند؟ این کار قابل بازگشت نیست.',()=>{db=structuredClone(defaultData);markDirty();render();toast('اطلاعات پاک شد')})}
function field(label,name,value,required=false,type='text'){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value??'')}" ${required?'required':''} ${type==='number'?'min="0" step="any"':''}></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function showModal(title,subtitle,body){$('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>${title}</h3>${subtitle?`<p class="muted">${subtitle}</p>`:''}${body}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function confirmAction(title,msg,fn){showModal(title,msg,`<div class="actions"><button class="danger" id="confirmYes">تأیید</button><button class="secondary" onclick="closeModal()">انصراف</button></div>`);$('#confirmYes').onclick=()=>{closeModal();fn()}}
$('#splashLogo').onerror=()=>{$('#splashLogo').style.display='none'};$('#topLogo').onerror=()=>{$('#topLogo').style.display='none'};
</script></body></html>
